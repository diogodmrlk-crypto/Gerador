<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Painel de Keys - Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --bg:#0b0b0d;
  --panel:#141417;
  --accent:#5865F2;
  --danger:#ef4444;
  --text:#f8fafc;
  --muted:#9ca3af;
  --mono:ui-monospace, monospace;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,Segoe UI,Roboto,Arial,sans-serif;
}
.panel{
  width:100%;
  max-width:480px;
  background:var(--panel);
  padding:20px;
  border-radius:14px;
  box-shadow:0 10px 40px rgba(0,0,0,.6);
}
h1{
  margin:0 0 15px;
  color:#ef4444;
  font-size:20px;
  text-align:center;
}
label{
  font-size:13px;
  color:var(--muted);
  display:block;
  margin-top:10px;
}
input, select, button{
  width:100%;
  padding:10px;
  border:none;
  border-radius:10px;
  margin-top:4px;
  background:#1f1f25;
  color:#fff;
  font-size:14px;
}
button{
  background:var(--accent);
  font-weight:700;
  cursor:pointer;
  margin-top:12px;
}
button.danger{background:var(--danger)}
pre{
  margin-top:10px;
  background:#0f1115;
  padding:10px;
  border-radius:10px;
  font-family:var(--mono);
  font-size:13px;
  max-height:180px;
  overflow:auto;
}
.hide{display:none}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="panel" id="loginPanel">
  <h1>Login Admin</h1>

  <label>Usuário</label>
  <input id="user" placeholder="admin">

  <label>Senha</label>
  <input id="pass" type="password" placeholder="******">

  <button onclick="login()">Entrar</button>
</div>

<!-- PAINEL -->
<div class="panel hide" id="adminPanel">
  <h1>Painel de Keys</h1>

  <label>Prefixo</label>
  <input id="prefix" value="FERRAO-">

  <label>Quantidade</label>
  <input id="qty" type="number" value="5" min="1" max="200">

  <label>Tipo de Expiração</label>
  <select id="type">
    <option value="daily">Daily (24h)</option>
    <option value="weekly">Weekly (7 dias)</option>
    <option value="perm">Permanente</option>
  </select>

  <label>MockAPI URL</label>
  <input id="api" value="https://69599c6e950475ada464ce41.mockapi.io/api/v1/keys">

  <button onclick="generate()">Gerar & Enviar</button>
  <button class="danger" onclick="logout()">Sair</button>

  <pre id="output">Keys aparecerão aqui...</pre>
</div>

<script>
/* ===== CONFIG LOGIN ===== */
const ADMIN_USER = "admin";
const ADMIN_PASS = "123456";

/* ===== LOGIN ===== */
function login(){
  if(
    document.getElementById("user").value === ADMIN_USER &&
    document.getElementById("pass").value === ADMIN_PASS
  ){
    loginPanel.classList.add("hide");
    adminPanel.classList.remove("hide");
  }else{
    alert("Login inválido");
  }
}
function logout(){
  location.reload();
}

/* ===== KEY GEN ===== */
const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

function randomKey(len){
  let s="";
  for(let i=0;i<len;i++) s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}

async function generate(){
  const prefix = prefixInput.value.trim();
  const qty = parseInt(qtyInput.value);
  const type = typeSelect.value;
  const api = apiInput.value.trim();

  output.textContent = "";
  if(!api){alert("MockAPI inválida");return;}

  for(let i=0;i<qty;i++){
    const key = prefix + randomKey(12);

    const payload = {
      key: key,
      used: false,
      device: "",
      type: type,
      createdAt: Math.floor(Date.now()/1000),
      activatedAt: 0
    };

    try{
      const res = await fetch(api,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify(payload)
      });
      output.textContent += key+" ✔\n";
    }catch(e){
      output.textContent += key+" ❌\n";
    }
  }
}

/* ===== ELEMENTS ===== */
const loginPanel = document.getElementById("loginPanel");
const adminPanel = document.getElementById("adminPanel");
const prefixInput = document.getElementById("prefix");
const qtyInput = document.getElementById("qty");
const typeSelect = document.getElementById("type");
const apiInput = document.getElementById("api");
const output = document.getElementById("output");
</script>

</body>
